allprojects {
    repositories {
        google()
        mavenCentral()
        // Pangle SDK (AdMob mediation).
        maven { url = uri("https://artifact.bytedance.com/repository/pangle/") }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// AGP 8+ requires `namespace` in every Android library module. Older plugins
// (e.g. flutter_chrome_cast 0.0.11) only declare `package` in AndroidManifest.
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        subproject.android {
            if (namespace == null) {
                namespace = subproject.group.toString()
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
